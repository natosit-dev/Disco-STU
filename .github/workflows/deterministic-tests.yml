name: DiScO STU deterministic verification
on:
  push:
    branches:
      - feature/stu-deterministic-pipeline-20261114
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile modules and pages
        run: python -m compileall -q sera stu pages tests
      - name: Existing SERA and new STU tests
        run: pytest -q
      - name: CLI synthetic end-to-end
        run: |
          python -m stu.cli --data-root "$RUNNER_TEMP/stu-e2e" doctor
          python -m stu.cli --data-root "$RUNNER_TEMP/stu-e2e" smoke --fixture F01 > "$RUNNER_TEMP/stu-smoke.json"
          python -m stu.cli --data-root "$RUNNER_TEMP/stu-invalid" smoke --fixture F07 > "$RUNNER_TEMP/stu-invalid.json"
          python -m stu.cli --data-root "$RUNNER_TEMP/stu-partial" smoke --fixture F08 > "$RUNNER_TEMP/stu-partial.json"
          python - <<'PY'
          import json, os, pathlib
          a=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stu-smoke.json').read_text())
          b=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stu-invalid.json').read_text())
          c=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stu-partial.json').read_text())
          assert a['verification']['valid'] is True
          assert a['run_status']=='completed'
          assert len(a['results']['paired_reconstructions']) == 1
          assert b['run_status']=='incomplete' and c['run_status']=='incomplete'
          print('Verified: full synthetic execution, invalid JSON, incomplete branch')
          PY
